<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2824">
<title>조선국뽕</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1221; overscroll-behavior: none; touch-action: none; }
  #g { position: fixed; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #0f1221; }
</style>
</head>
<body>
<!-- [Claude 작업 · 2026-10-11] 웹에서 해 보는 주소용 껍데기. 게임(game.html)은 가로 화면만 그린다 —
     폰이 세로로 잠겨 있으면 '가로로 돌려 주세요'에서 멈추므로, 세로일 때는 이 틀이 게임을 90도 돌려 가로로 보여 준다. -->
<iframe id="g" src="game.html?v=7" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
  const g = document.getElementById('g');
  function fit() {
    const w = window.innerWidth, h = window.innerHeight;
    if (h > w) { g.style.width = h + 'px'; g.style.height = w + 'px'; g.style.transform = 'translate(' + w + 'px, 0) rotate(90deg)'; }
    else { g.style.width = w + 'px'; g.style.height = h + 'px'; g.style.transform = 'none'; }
  }
  fit(); addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250));
</script>
</body>
</html>
